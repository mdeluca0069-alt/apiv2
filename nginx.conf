# nginx.conf — IGFXPRO-OLOS reverse proxy for the PM2 bare-metal deployment path
#
# NOTE: this is the reverse proxy for ecosystem.config.cjs's PM2 cluster path,
# a documented alternative — the pipeline CI actually drives Docker Compose
# over SSH (docker-compose.prod.yml, api service on port 3001). Kept in sync
# with that same port so the two paths don't disagree if this one is used.
#
# Architecture:
#   nginx (port 80/443) → PM2 cluster (port 3001, all workers share one socket)
#
# With PM2 cluster mode, all 8 Node.js workers share the SAME listening socket
# on port 3001. The OS distributes connections across workers. Nginx handles:
#   - SSL termination (HTTPS → HTTP internally)
#   - Gzip compression
#   - Static file serving (if applicable)
#   - HTTP/2
#   - Connection rate limiting
#   - WebSocket proxying

worker_processes  auto;
worker_rlimit_nofile 65535;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;         # Linux; use kqueue on macOS
}

http {
    # ── Connection & request limits ──────────────────────────────────────────
    # Prevent a single IP from hammering the API (e.g. bot attacks)
    limit_req_zone  $binary_remote_addr zone=api_rate:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 10000;
    gzip               on;
    gzip_comp_level    4;
    gzip_types         text/plain application/json application/javascript;

    # ── Upstream: PM2 cluster on port 3001 ───────────────────────────────────
    # All PM2 cluster workers share the SAME socket (port 3001).
    # No need to list individual worker ports — the OS does load balancing.
    upstream igfxpro_api {
        server    127.0.0.1:3001;
        keepalive 64;                  # keep 64 idle upstream connections
    }

    # ── WebSocket upstream ────────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ""       close;
    }

    # ── Main server block ─────────────────────────────────────────────────────
    server {
        listen      80;
        server_name _;                  # replace with your domain in production

        # ── Rate limiting ─────────────────────────────────────────────────────
        limit_req  zone=api_rate burst=200 nodelay;
        limit_conn zone=api_conn 50;

        # ── Proxy settings ────────────────────────────────────────────────────
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        # PHASE2_REMEDIATION (H18): $proxy_add_x_forwarded_for APPENDS
        # nginx's view of the client to whatever X-Forwarded-For value the
        # client already sent -- a direct attacker request carrying its own
        # forged "X-Forwarded-For: 1.2.3.4" arrived at the app as
        # "1.2.3.4, <real-ip>", and every IP-keyed control in the app
        # (rate limiter, IP reputation, credential-stuffing detection)
        # trusted the leftmost (attacker-supplied) entry. nginx is the sole
        # internet-facing edge in this topology (see header docstring) --
        # $remote_addr is the actual TCP peer nginx itself observed and
        # cannot be spoofed by the client, so overwrite (not append) here.
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # ── REST API ──────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass          http://igfxpro_api;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            proxy_connect_timeout 5s;
        }

        # ── WebSocket endpoint ────────────────────────────────────────────────
        location /ws {
            proxy_pass          http://igfxpro_api;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection $connection_upgrade;
            proxy_read_timeout  3600s;     # hold WS connections open for 1 hour
            proxy_send_timeout  3600s;
        }

        # ── Health check (unauthenticated) ────────────────────────────────────
        location /health {
            proxy_pass         http://igfxpro_api;
            access_log         off;
            proxy_read_timeout 5s;
        }
    }

    # ── HTTPS (enable after obtaining TLS cert) ───────────────────────────────
    # server {
    #     listen      443 ssl http2;
    #     server_name api.igfxpro.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/igfxpro.crt;
    #     ssl_certificate_key /etc/nginx/ssl/igfxpro.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #
    #     include /etc/nginx/conf.d/location_blocks.conf;
    # }
}

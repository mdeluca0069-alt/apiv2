global:
  scrape_interval:     10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # External Alertmanager if needed

rule_files: []

scrape_configs:
  - job_name: igfxpro-api
    static_configs:
      # Scrape all 4 PM2 workers (ports 3000–3003)
      - targets:
          - host.docker.internal:3000
          - host.docker.internal:3001
          - host.docker.internal:3002
          - host.docker.internal:3003
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 5s

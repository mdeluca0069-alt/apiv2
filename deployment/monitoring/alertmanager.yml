global:
  resolve_timeout: 5m
  # SMTP for email alerts — configure via env vars at compose level.
  # PRODUCTION CUTOVER Stage 3B: this file is rendered by `envsubst`
  # (docker-compose.monitoring.yml's alertmanager-config service), which
  # only does literal $VAR/${VAR} substitution -- it does NOT understand
  # bash's ${VAR:-default} fallback syntax (confirmed live: alertmanager
  # crash-looped with "too many colons in address" because the whole
  # "${SMTP_HOST:-localhost}" string passed through unexpanded). Default
  # values now live in docker-compose.monitoring.yml's own environment
  # block instead, where Compose's interpolation engine resolves them
  # correctly before envsubst ever runs -- this template only ever sees
  # plain ${VAR} references to an already-resolved value.
  smtp_smarthost:   "${SMTP_HOST}:${SMTP_PORT}"
  smtp_from:        "${SMTP_FROM}"
  smtp_auth_username: "${SMTP_USER}"
  smtp_auth_password: "${SMTP_PASS}"
  smtp_require_tls: true

# ── Routing ────────────────────────────────────────────────────────────────────
route:
  receiver:         default
  group_by:         [alertname, severity, team]
  group_wait:       30s
  group_interval:   5m
  repeat_interval:  4h

  routes:
    # Critical alerts → PagerDuty + Slack immediately
    - match:
        severity: critical
      receiver: pagerduty-critical
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    - match:
        severity: critical
      receiver: slack-critical
      continue: false

    # Warning alerts → Slack only
    - match:
        severity: warning
      receiver: slack-warning

    # Compliance alerts → compliance team email
    - match:
        team: compliance
      receiver: compliance-email

    # Security alerts → security team
    - match:
        team: security
      receiver: slack-security

# ── Inhibition rules ───────────────────────────────────────────────────────────
inhibit_rules:
  # Suppress all other alerts when the API is completely down
  - source_match:
      alertname: ApiDown
    target_match_re:
      alertname: .+
    equal: [env]

  # Suppress warning if critical already firing for same alertname
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, team]

# ── Receivers ──────────────────────────────────────────────────────────────────
receivers:
  - name: default
    slack_configs:
      - api_url: "${ALERTMANAGER_SLACK_WEBHOOK}"
        channel: "#igfxpro-alerts"
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: "${ALERTMANAGER_PAGERDUTY_KEY}"
        description: "{{ .CommonAnnotations.summary }}"
        details:
          firing:   "{{ .Alerts.Firing | len }}"
          resolved: "{{ .Alerts.Resolved | len }}"

  - name: slack-critical
    slack_configs:
      - api_url: "${ALERTMANAGER_SLACK_WEBHOOK}"
        channel: "#igfxpro-oncall"
        send_resolved: true
        color: danger
        title: "🚨 CRITICAL: {{ .CommonAnnotations.summary }}"
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          *Since:* {{ .StartsAt }}
          {{ end }}

  - name: slack-warning
    slack_configs:
      - api_url: "${ALERTMANAGER_SLACK_WEBHOOK}"
        channel: "#igfxpro-alerts"
        send_resolved: true
        color: warning
        title: "⚠️  {{ .CommonAnnotations.summary }}"
        text: |
          {{ range .Alerts }}
          {{ .Annotations.description }}
          {{ end }}

  - name: slack-security
    slack_configs:
      - api_url: "${ALERTMANAGER_SLACK_WEBHOOK}"
        channel: "#igfxpro-security"
        send_resolved: true
        color: danger
        title: "🔐 Security alert: {{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}"

  - name: compliance-email
    email_configs:
      - to: "${COMPLIANCE_EMAIL}"
        send_resolved: true
        html: |
          <h2>{{ .CommonAnnotations.summary }}</h2>
          <p>{{ .CommonAnnotations.description }}</p>
          <ul>
          {{ range .Alerts }}
            <li>Started: {{ .StartsAt }}</li>
          {{ end }}
          </ul>

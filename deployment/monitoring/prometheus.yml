global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    env:     production
    service: igfxpro

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alerts.rules.yml"

scrape_configs:
  # ── Backend API ─────────────────────────────────────────────────────────────
  - job_name: igfxpro_api
    scrape_interval: 15s
    scrape_timeout:  10s
    metrics_path: /metrics
    # Remove or leave empty if METRICS_TOKEN is unset
    authorization:
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["api:3001"]
        labels:
          component: backend

  # ── PostgreSQL (via postgres_exporter) ────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          component: database

  # ── Redis (via redis_exporter) ────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          component: cache

  # ── Node exporter (host metrics) ─────────────────────────────────────────
  # PHASE2_REMEDIATION (H13): node-exporter runs with `network_mode: host`
  # in docker-compose.monitoring.yml (required so it reports the real
  # host's CPU/memory/disk, not its own container's) -- it therefore has
  # NO Docker-DNS name, and `node-exporter:9100` could never resolve. Host
  # metrics were silently entirely absent from Prometheus/Grafana despite
  # the container being deployed and running. host.docker.internal (wired
  # via that file's `extra_hosts: host-gateway` on the prometheus service)
  # is the address that actually reaches the host's network namespace,
  # where node-exporter is really listening.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          component: host

  # ── Prometheus self-monitoring ────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
